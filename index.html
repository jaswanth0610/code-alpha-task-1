<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Music Player</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="player">

    <!-- Heading -->
    <h1>🎵 Music Player</h1>

    <!-- Album Image -->
    <div class="image">
      <img
        id="cover"
        src="images/music.png"
        alt="music"
      >
    </div>

    <!-- Song Details -->
    <div class="details">
      <h2 id="song-title">Song Title</h2>
      <p id="artist">Artist Name</p>
    </div>

    <!-- Audio -->
    <audio id="audio"></audio>

    <!-- Progress Bar -->
    <div class="progress-container">

      <input
        type="range"
        id="progress"
        value="0"
        min="0"
        max="100"
      >

      <!-- Time -->
      <div class="time">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
      </div>

    </div>

    <!-- Controls -->
    <div class="controls">

      <button id="prev">⏮</button>

      <button id="play">▶</button>

      <button id="next">⏭</button>

    </div>

    <!-- Volume -->
    <div class="volume-container">

      <label>🔊 Volume</label>

      <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.1"
        value="1"
      >

    </div>

    <!-- Playlist -->
    <div class="playlist">

      <h3>🎶 Playlist</h3>

      <ul id="playlist"></ul>

    </div>

  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>

</body>

</html>
